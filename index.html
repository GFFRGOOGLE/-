<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurora</title>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#060914;--bg2:#0b1120;--glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.18);--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--cyan:#22d3ee;--violet:#a78bfa;--pink:#f472b6;--ok:#10b981;--danger:#f43f5e;--gold:#fbbf24;--grad:linear-gradient(135deg,#22d3ee,#a78bfa,#f472b6);--grad-me:linear-gradient(135deg,#0891b2,#7c3aed)}
body.light{--bg:#f8fafc;--bg2:#fff;--glass:rgba(0,0,0,.03);--glass2:rgba(0,0,0,.06);--border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.18);--text:#0f172a;--text2:#475569;--text3:#94a3b8}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:15px;line-height:1.5}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 20% 20%,rgba(34,211,238,.15),transparent 40%),radial-gradient(circle at 80% 80%,rgba(167,139,250,.18),transparent 40%)}
#app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column}
header{padding:12px 14px;background:var(--glass);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--glass);color:var(--text);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.icon-btn:active{transform:scale(.94);background:var(--glass2)}
.icon-btn.hide{display:none}
.info{flex:1;min-width:0}
.info .t{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .s{font-size:11.5px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.join-bar{padding:10px 14px;background:var(--glass);border-bottom:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
.join-bar.hide{display:none}
.join-bar input{flex:1;padding:12px 14px;background:var(--glass2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;min-width:0}
.join-bar input:focus{border-color:var(--cyan)}
.join-bar button{padding:12px 16px;background:var(--grad);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0;font-family:inherit}
.join-bar button:active{opacity:.8}
#messages{flex:1;overflow-y:auto;padding:16px 12px 12px;display:flex;flex-direction:column;gap:8px}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.4;word-wrap:break-word;animation:m .2s}
@keyframes m{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg.me{align-self:flex-end;background:var(--grad-me);color:#fff;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--glass);border:1px solid var(--border);border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:transparent;color:var(--text3);font-size:12px;padding:5px 14px;text-align:center;border:1px dashed var(--border2);border-radius:100px;max-width:90%}
.msg .sn{font-size:11.5px;font-weight:700;margin-bottom:3px;opacity:.9}
.msg img,.msg video{max-width:100%;border-radius:12px;margin-top:6px;display:block;max-height:360px;object-fit:cover}
.msg audio{width:100%;margin-top:6px}
.file-card{display:flex;align-items:center;gap:10px;min-width:200px}
.file-thumb{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-size{font-size:11px;opacity:.7}
.file-dl{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:inherit;text-decoration:none;font-size:15px;flex-shrink:0}
.progress{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));width:0;transition:width .2s}
.input-bar{padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px) + 60px);display:flex;align-items:flex-end;gap:6px;background:var(--glass);border-top:1px solid var(--border);flex-shrink:0}
.round-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--glass);color:var(--text2);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.round-btn:active{background:var(--glass2);transform:scale(.94)}
.round-btn.rec{background:var(--danger);color:#fff}
textarea{flex:1;min-height:42px;max-height:130px;padding:11px 14px;background:var(--glass2);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:14.5px;font-family:inherit;outline:none;resize:none;line-height:1.4;min-width:0}
textarea:focus{border-color:var(--cyan)}
textarea::placeholder{color:var(--text3)}
#sendBtn{width:42px;height:42px;border-radius:12px;border:none;background:var(--grad);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;font-family:inherit}
#sendBtn:active{opacity:.8}
.menu{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--bg2);border-right:1px solid var(--border2);z-index:1000;transform:translateX(-100%);transition:.25s;display:flex;flex-direction:column;box-shadow:4px 0 30px rgba(0,0,0,.5)}
.menu.open{transform:translateX(0)}
.menu-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.menu-header .bt{font-weight:800;font-size:16px}
.menu-body{flex:1;overflow-y:auto;padding:8px}
.menu-body button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:none;background:transparent;color:var(--text);font-size:14.5px;font-family:inherit;cursor:pointer;border-radius:10px;text-align:left;font-weight:500}
.menu-body button:active{background:var(--glass2)}
.menu-body button.red{color:var(--danger);font-weight:700}
.menu-body button.blue{color:var(--cyan);font-weight:700}
.menu-body .sep{height:1px;background:var(--border);margin:6px 8px}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none}
.backdrop.open{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:1100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:22px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto}
.modal h2{font-size:18px;font-weight:800;margin-bottom:14px}
.modal input{width:100%;padding:12px 14px;background:var(--glass2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:10px}
.modal input:focus{border-color:var(--cyan)}
.modal .row{display:flex;gap:8px;margin-top:6px}
.modal .row button{flex:1;padding:12px;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.modal .row .p{background:var(--grad);color:#fff}
.modal .row .s{background:var(--glass);border:1px solid var(--border2);color:var(--text)}
#callScreen{position:fixed;inset:0;background:#000;z-index:1200;display:none;flex-direction:column;color:#fff}
#callScreen.open{display:flex}
#callMain{flex:1;position:relative;overflow:hidden;background:#0a0a14}
#remoteVideo{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;background:#0a0a14}
#callMain.audio #remoteVideo{display:none}
#callMain.audio::after{content:'📞';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:100px;opacity:.3}
#localVideo{position:absolute;top:60px;right:12px;width:100px;aspect-ratio:9/16;border-radius:14px;border:2px solid rgba(255,255,255,.2);object-fit:cover;z-index:5;background:#000}
#callMain.audio #localVideo{display:none}
#callTop{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.6);padding:8px 14px;border-radius:100px;z-index:6;display:flex;align-items:center;gap:8px}
#callTop .dot{width:8px;height:8px;background:var(--ok);border-radius:50%}
#callTop .nm{font-size:13px;font-weight:700}
#callTop .tm{font-size:12px;opacity:.6;font-family:monospace}
#callBar{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:14px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent)}
.cbtn{width:58px;height:58px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cbtn:active{transform:scale(.94)}
.cbtn.off{background:rgba(255,255,255,.55);color:#000}
.cbtn.end{background:var(--danger)}
#incoming{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);z-index:1300;display:none;align-items:center;justify-content:center;padding:20px}
#incoming.open{display:flex}
.inc-card{background:var(--bg2);border:1px solid var(--border2);border-radius:24px;padding:32px 24px;text-align:center;max-width:340px;width:100%}
.inc-av{width:100px;height:100px;border-radius:50%;background:var(--grad-me);color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;margin:0 auto 18px}
.inc-name{font-size:20px;font-weight:800;margin-bottom:6px}
.inc-type{font-size:13px;color:var(--text2);margin-bottom:24px}
.inc-actions{display:flex;gap:22px;justify-content:center}
.inc-actions button{width:64px;height:64px;border-radius:50%;border:none;color:#fff;font-size:24px;cursor:pointer}
.inc-actions .rej{background:var(--danger)}
.inc-actions .acc{background:var(--ok)}
#outMini{position:fixed;bottom:24px;left:14px;right:14px;background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:14px 16px;display:none;align-items:center;gap:12px;z-index:1050;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#outMini.open{display:flex}
#outMini .info{flex:1}
#outMini .om-n{font-size:14px;font-weight:700}
#outMini .om-s{font-size:12px;color:var(--text2)}
#outMini .om-x{width:40px;height:40px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:16px;cursor:pointer;flex-shrink:0}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(100px);padding:12px 22px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;font-size:13.5px;color:var(--text);opacity:0;transition:.3s;z-index:2000;max-width:90vw;text-align:center;pointer-events:none;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<div id="app">
  <header>
    <button class="icon-btn" id="menuBtn">☰</button>
    <div class="info">
      <div class="t" id="title">Заметки</div>
      <div class="s" id="subtitle">Пишите — сохраняется у вас</div>
    </div>
    <button class="icon-btn hide" id="callAudio">📞</button>
    <button class="icon-btn hide" id="callVideo">📹</button>
    <button class="icon-btn" id="themeBtn">🌙</button>
  </header>

  <div class="join-bar" id="joinBar">
    <input id="roomInput" placeholder="Название комнаты" maxlength="40" autocomplete="off">
    <button id="joinBtn">Войти</button>
  </div>

  <div id="messages"></div>
  <div class="input-bar">
    <button class="round-btn" id="fileBtn">📎</button>
    <textarea id="msgInput" placeholder="Сообщение..." rows="1"></textarea>
    <button id="sendBtn">➤</button>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="menu" id="menu">
  <div class="menu-header">
    <div class="bt">Меню</div>
    <button class="icon-btn" id="menuClose">✕</button>
  </div>
  <div class="menu-body">
    <button id="mJoin" class="blue">🔑 Войти в комнату</button>
    <button id="mLeave" class="red">🚪 Покинуть комнату</button>
    <div class="sep"></div>
    <button id="mNotes">📝 Заметки</button>
    <button id="mClear">🗑 Очистить</button>
    <button id="mNotify">🔔 Уведомления</button>
    <button id="mSettings">⚙️ Настройки</button>
  </div>
</div>

<div class="modal-bg" id="settingsBg">
  <div class="modal">
    <h2>⚙️ Настройки</h2>
    <input id="nickInput" placeholder="Ваше имя" maxlength="24">
    <input id="passInput" type="password" placeholder="Пароль (необязательно)">
    <div class="row">
      <button class="s" id="setCancel">Отмена</button>
      <button class="p" id="setSave">Сохранить</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" multiple style="display:none">
<input type="file" id="galleryInput" accept="image/*,video/*" multiple style="display:none">

<div id="callScreen">
  <div id="callMain">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="callTop">
      <div class="dot"></div>
      <div class="nm" id="callName">—</div>
      <div class="tm" id="callTime">00:00</div>
    </div>
  </div>
  <div id="callBar">
    <button class="cbtn" id="cMic">🎤</button>
    <button class="cbtn" id="cCam" style="display:none">📹</button>
    <button class="cbtn end" id="cEnd">📵</button>
  </div>
</div>

<div id="incoming">
  <div class="inc-card">
    <div class="inc-av" id="incAv">?</div>
    <div class="inc-name" id="incName">Собеседник</div>
    <div class="inc-type" id="incType">Звонок...</div>
    <div class="inc-actions">
      <button class="rej" id="incRej">✕</button>
      <button class="acc" id="incAcc">📞</button>
    </div>
  </div>
</div>

<div id="outMini">
  <div class="info">
    <div class="om-n" id="outName">—</div>
    <div class="om-s" id="outStatus">Вызов...</div>
  </div>
  <button class="om-x" id="outCancel">✕</button>
</div>

<div id="toast"></div>

<script type="module">
/* ============= УТИЛИТЫ ============= */
const $ = id => document.getElementById(id);
const msgs = $('messages');
const toast = $('toast');

function showToast(t, d=2200){
  toast.textContent = t;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), d);
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function gid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function ini(n){ if(!n) return '?'; return n.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase() || '?'; }
function fmt(b){ if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(1)+' KB'; if(b<1073741824)return (b/1048576).toFixed(1)+' MB'; return (b/1073741824).toFixed(2)+' GB'; }
function col(p){ const c=['#22d3ee','#a78bfa','#f472b6','#34d399','#fbbf24','#fb7185','#38bdf8','#4ade80']; let h=0; for(let i=0;i<p.length;i++)h=(h*31+p.charCodeAt(i))|0; return c[Math.abs(h)%c.length]; }

/* ============= СОСТОЯНИЕ ============= */
let room = null;
let sendText=null, sendFm=null, sendFc=null, sendFe=null, sendTyp=null, sendName=null, sendCall=null;
let cryptoKey = null;
let notesMode = true;
let mediaRec = null;
let audioChunks = [];
let lastTyp = 0;
const recv = new Map();
const peers = new Map();
let roomId = null;
const joined = new Map();

const call = { active:false, incoming:false, video:false, local:null, remote:null, peer:null, timer:null, start:0, mic:true, cam:true };
const S = { nick:'Аноним', pass:'', theme:'dark', notify:true };
const NOTE_KEY = 'aurora_notes_v1';
const SETTINGS_KEY = 'aurora_settings';

/* ============= ХРАНИЛИЩЕ ============= */
function loadSettings(){
  try{ const r = localStorage.getItem(SETTINGS_KEY); if(r) Object.assign(S, JSON.parse(r)); }catch(e){}
}
function saveSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(S)); }catch(e){}
}
function applyTheme(){
  document.body.classList.toggle('light', S.theme === 'light');
  $('themeBtn').textContent = S.theme === 'light' ? '☀️' : '🌙';
}

function getNotes(){ try{ return JSON.parse(localStorage.getItem(NOTE_KEY) || '[]'); }catch(e){ return []; } }
function setNotes(a){ try{ localStorage.setItem(NOTE_KEY, JSON.stringify(a.slice(-500))); }catch(e){} }
function saveNote(item){ const a = getNotes(); a.push(item); setNotes(a); }
function delNote(id){ setNotes(getNotes().filter(x => x.id !== id)); }

function blobB64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function b64Blob(b64, type){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: type || 'application/octet-stream' });
}

/* ============= СООБЩЕНИЯ (UI) ============= */
function addMsg(text, type, opts){
  type = type || 'them';
  opts = opts || {};
  const w = document.createElement('div');
  w.className = 'msg ' + type;
  if(opts.msgId) w.dataset.msgid = opts.msgId;
  if(opts.sender && type === 'them'){
    const s = document.createElement('div');
    s.className = 'sn';
    s.textContent = opts.sender;
    if(opts.color) s.style.color = opts.color;
    w.appendChild(s);
  }
  const sp = document.createElement('span');
  sp.textContent = text;
  w.appendChild(sp);
  msgs.appendChild(w);
  msgs.scrollTop = msgs.scrollHeight;
  return w;
}

function renderFileMsg(name, size, url, side, enc, senderId, msgId){
  const d = document.createElement('div');
  d.className = 'msg ' + side;
  if(msgId) d.dataset.msgid = msgId;
  if(side === 'them' && senderId){
    const s = document.createElement('div');
    s.className = 'sn';
    s.textContent = peers.get(senderId)?.name || 'Аноним';
    s.style.color = col(senderId);
    d.appendChild(s);
  }
  const isImg = /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(name);
  const isVid = /\.(mp4|webm|ogg|mov|mkv)$/i.test(name);
  const isAud = /\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(name);
  const ic = isImg ? '🖼️' : isVid ? '🎬' : isAud ? '🎵' : '📄';
  let prev = '';
  if(isImg) prev = `<img src="${url}">`;
  else if(isVid) prev = `<video src="${url}" controls></video>`;
  else if(isAud) prev = `<audio src="${url}" controls></audio>`;
  d.innerHTML = `<div class="file-card"><div class="file-thumb">${ic}</div><div class="file-info"><div class="file-name">${esc(name)}</div><div class="file-size">${fmt(size)}${enc?' 🔒':''}</div></div><a class="file-dl" href="${url}" download="${esc(name)}">⬇</a></div>${prev}`;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function clearMsgs(){ msgs.innerHTML = ''; }

/* ============= ЗАМЕТКИ ============= */
function loadNotes(){
  clearMsgs();
  const notes = getNotes();
  if(!notes.length){
    addMsg('📝 Это заметки. Всё сохраняется у вас. Чтобы общаться — войдите в комнату.', 'sys');
    return;
  }
  for(const n of notes){
    if(n.type === 'file' && n.blobData){
      try{ n.blobUrl = URL.createObjectURL(b64Blob(n.blobData, n.fileType)); }catch(e){ continue; }
    }
    if(n.type === 'text') addMsg(n.text, 'me', {msgId: n.id});
    else if(n.type === 'file') renderFileMsg(n.fileName, n.fileSize, n.blobUrl, 'me', false, null, n.id);
  }
}

function enterNotesMode(){
  notesMode = true;
  roomId = null;
  $('title').textContent = '📝 Заметки';
  $('subtitle').textContent = 'Всё сохраняется у вас';
  $('callAudio').classList.add('hide');
  $('callVideo').classList.add('hide');
  $('joinBar').classList.remove('hide');
  loadNotes();
}

/* ============= КРИПТО ============= */
async function initCrypto(id){
  const sec = S.pass ? `p2p:${S.pass}:${id}` : `p2p:${id}`;
  try{
    const e = new TextEncoder();
    const k = await crypto.subtle.importKey('raw', e.encode(sec), {name:'PBKDF2'}, false, ['deriveKey']);
    cryptoKey = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt: e.encode('aurora'), iterations:100000, hash:'SHA-256'},
      k, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
    );
  }catch(e){ cryptoKey = null; }
}
async function encT(t){
  if(!cryptoKey) return {plain:t};
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({name:'AES-GCM', iv}, cryptoKey, new TextEncoder().encode(t));
  return {iv: Array.from(iv), enc: Array.from(new Uint8Array(c))};
}
async function decT(p){
  if(p.plain !== undefined) return p.plain;
  if(!cryptoKey) throw new Error('NO_KEY');
  const r = await crypto.subtle.decrypt({name:'AES-GCM', iv: new Uint8Array(p.iv)}, cryptoKey, new Uint8Array(p.enc));
  return new TextDecoder().decode(r);
}
async function encB(b){
  if(!cryptoKey) return b;
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({name:'AES-GCM', iv}, cryptoKey, b);
  const o = new Uint8Array(12 + c.byteLength);
  o.set(iv, 0); o.set(new Uint8Array(c), 12);
  return o.buffer;
}
async function decB(b){
  if(!cryptoKey) return b;
  const v = new Uint8Array(b);
  return await crypto.subtle.decrypt({name:'AES-GCM', iv: v.slice(0,12)}, cryptoKey, v.slice(12));
}

/* ============= TRYSTERO ============= */
let joinRoomFn = null;
async function loadTrystero(){
  if(joinRoomFn) return;
  const urls = [
    'https://esm.sh/trystero@0.21.5/mqtt',
    'https://cdn.jsdelivr.net/npm/trystero@0.21.5/mqtt/+esm',
    'https://esm.sh/trystero@0.21.5/nostr'
  ];
  for(const u of urls){
    try{
      const m = await import(/* @vite-ignore */ u);
      if(m.joinRoom){ joinRoomFn = m.joinRoom; return; }
    }catch(e){}
  }
  throw new Error('Не удалось загрузить библиотеку связи');
}

async function startRoom(id){
  if(room) return;
  roomId = id;
  notesMode = false;
  $('title').textContent = 'Подключение...';
  $('subtitle').textContent = id;
  try{
    await loadTrystero();
    await initCrypto(id);

    const iceServers = [
      {urls: 'stun:stun.l.google.com:19302'},
      {urls: 'stun:stun1.l.google.com:19302'},
      {urls: 'stun:stun.cloudflare.com:3478'},
      {urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject'},
      {urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject'},
      {urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject'},
      {urls: 'turns:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject'}
    ];

    room = joinRoomFn({ appId: 'aurora-v15', rtcConfig: { iceServers, iceCandidatePoolSize: 10 } }, id);

    [sendText] = room.makeAction('t');
    let onText;
    [sendFm, onFmWrapper] = room.makeAction('fm');
    [sendFc, onFcWrapper] = room.makeAction('fc');
    [sendFe, onFeWrapper] = room.makeAction('fe');
    [sendTyp, onTypWrapper] = room.makeAction('typ');
    [sendName, onNameWrapper] = room.makeAction('n');
    [sendCall, onCallWrapper] = room.makeAction('call');
    [ , onTextW] = room.makeAction('t');

    onTextW(async (p, pid) => {
      try{
        const t = await decT(p);
        addMsg(t, 'them', { msgId: p.msgId, sender: peers.get(pid)?.name || 'Аноним', color: col(pid) });
        notify(peers.get(pid)?.name || 'Сообщение', t);
      }catch(e){}
    });
    onFmWrapper((m, pid) => { recv.set(m.id, { ...m, chunks: [], senderId: pid }); });
    onFcWrapper((c, pid, m) => { const f = recv.get(m?.id); if(f) f.chunks.push(c); });
    onFeWrapper(async (m, pid) => {
      const f = recv.get(m.id);
      if(!f) return;
      try{
        let ch = f.chunks;
        if(f.encrypted && cryptoKey){
          const o = [];
          for(const c of ch){ try{ o.push(await decB(c)); }catch(e){ o.push(c); } }
          ch = o;
        }
        const blob = new Blob(ch, { type: f.type || 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        renderFileMsg(f.name, f.size, url, 'them', f.encrypted, pid, m.id);
        notify(peers.get(pid)?.name || 'Файл', '📎 ' + f.name);
      }catch(e){}
      recv.delete(m.id);
    });
    onTypWrapper((isT, pid) => {
      if(!isT) return;
      const el = $('subtitle');
      el.textContent = (peers.get(pid)?.name || 'Кто-то') + ' печатает...';
      clearTimeout(el._t);
      el._t = setTimeout(() => updateHeader(), 2000);
    });
    onNameWrapper((n, pid) => {
      if(!peers.has(pid)) peers.set(pid, { name: n, color: col(pid) });
      else peers.get(pid).name = n;
      if(!joined.has(pid)) joined.set(pid, Date.now());
      updateHeader();
    });
    onCallWrapper((sig, pid) => { call.peer = pid; handleCall(sig, pid); });

    if(typeof room.onPeerStream === 'function'){
      room.onPeerStream((stream, pid) => {
        call.remote = stream;
        const rv = $('remoteVideo');
        rv.srcObject = stream;
        rv.play().catch(()=>{});
        const hasV = stream.getVideoTracks().length > 0;
        $('callMain').classList.toggle('audio', !hasV);
      });
    }

    room.onPeerJoin(pid => {
      peers.set(pid, { name: 'Аноним-' + String(pid).slice(0,4), color: col(pid) });
      joined.set(pid, Date.now());
      const ann = () => { try{ sendName(S.nick, pid); }catch(e){} };
      ann(); setTimeout(ann, 500); setTimeout(ann, 1500);
      addMsg('👤 Кто-то присоединился', 'sys');
      $('callAudio').classList.remove('hide');
      $('callVideo').classList.remove('hide');
      updateHeader();
    });
    room.onPeerLeave(pid => {
      peers.delete(pid);
      addMsg('👋 Участник вышел', 'sys');
      updateHeader();
      if(call.active && call.peer === pid) endCall(false);
    });

    $('joinBar').classList.add('hide');
    $('callAudio').classList.remove('hide');
    $('callVideo').classList.remove('hide');
    clearMsgs();
    addMsg('🔒 Подключено к комнате: ' + id, 'sys');
    addMsg('Отправьте ссылку другу: ' + location.origin + location.pathname + '#room=' + id, 'sys');
    updateHeader();
    showToast('✅ Комната: ' + id);
  }catch(e){
    $('title').textContent = 'Ошибка';
    $('subtitle').textContent = e.message;
    showToast('❌ ' + e.message, 3500);
    setTimeout(enterNotesMode, 2000);
  }
}

function updateHeader(){
  if(notesMode){
    $('title').textContent = '📝 Заметки';
    $('subtitle').textContent = 'Всё сохраняется у вас';
    return;
  }
  $('title').textContent = 'Комната: ' + roomId;
  $('subtitle').textContent = peers.size === 0 ? 'Ожидание участников' : peers.size + ' в сети';
}

/* ============= УВЕДОМЛЕНИЯ ============= */
async function askNotify(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    try{ await Notification.requestPermission(); }catch(e){}
  }
}
function notify(title, body){
  if(!S.notify) return;
  if(document.visibilityState === 'visible' && document.hasFocus()) return;
  try{
    if(Notification.permission === 'granted') new Notification(title, { body, tag: 'aurora' });
  }catch(e){}
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 800;
    g.gain.setValueAtTime(0.1, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    o.start(); o.stop(ctx.currentTime + 0.25);
  }catch(e){}
}

/* ============= ОТПРАВКА ============= */
async function sendMsg(){
  const inp = $('msgInput');
  const t = inp.value.trim();
  if(!t) return;
  const id = gid();
  if(notesMode){
    addMsg(t, 'me', { msgId: id });
    saveNote({ id, type: 'text', text: t, ts: Date.now() });
    inp.value = '';
    inp.style.height = 'auto';
    return;
  }
  if(!room || !sendText) return;
  const p = { ...(await encT(t)), msgId: id };
  sendText(p);
  addMsg(t, 'me', { msgId: id });
  inp.value = '';
  inp.style.height = 'auto';
  try{ sendTyp(false); }catch(e){}
}

async function sendFile(file){
  if(notesMode){
    const id = gid();
    const url = URL.createObjectURL(file);
    renderFileMsg(file.name, file.size, url, 'me', false, null, id);
    let bd = null;
    if(file.size < 4*1024*1024){ try{ bd = await blobB64(file); }catch(e){} }
    saveNote({ id, type:'file', fileName: file.name, fileSize: file.size, fileType: file.type, blobData: bd, ts: Date.now() });
    showToast(bd ? '📝 Сохранено' : '⚠️ Файл большой, не сохранится');
    return;
  }
  if(!room || !sendFm) return;
  const id = gid();
  const enc = !!cryptoKey;
  sendFm({ id, name: file.name, size: file.size, type: file.type, encrypted: enc });
  const buf = await file.arrayBuffer();
  const total = buf.byteLength;
  let sent = 0;
  const el = document.createElement('div');
  el.className = 'msg me';
  el.dataset.msgid = id;
  el.innerHTML = `<div class="file-card"><div class="file-thumb">📄</div><div class="file-info"><div class="file-name">${esc(file.name)}</div><div class="file-size">${fmt(file.size)} · отправка</div></div></div><div class="progress"><i></i></div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  const bar = el.querySelector('.progress i');
  const info = el.querySelector('.file-size');
  const CHUNK = 16*1024;
  const next = async () => {
    if(sent >= total){
      sendFe({ id }, null);
      const url = URL.createObjectURL(file);
      el.remove();
      renderFileMsg(file.name, file.size, url, 'me', enc, null, id);
      return;
    }
    const slice = buf.slice(sent, sent + CHUNK);
    let ch = slice;
    if(enc){ try{ ch = await encB(slice); }catch(e){ ch = slice; } }
    try{ sendFc(ch, null, { id }); }catch(e){}
    sent += slice.byteLength;
    const p = Math.round(sent / total * 100);
    bar.style.width = p + '%';
    info.textContent = fmt(file.size) + ' · ' + p + '%';
    setTimeout(next, 0);
  };
  next();
}

/* ============= ЗВОНКИ ============= */
function isMyRoleCaller(){ return !notesMode; }

async function startCall(video){
  if(!room || peers.size === 0) return showToast('Нет участников');
  if(call.active) return showToast('Уже идёт звонок');
  const pid = [...peers.keys()][0];
  call.active = true;
  call.video = video;
  call.peer = pid;
  call.mic = true;
  call.cam = video;
  $('outMini').classList.add('open');
  $('outName').textContent = peers.get(pid)?.name || 'Собеседник';
  $('outStatus').textContent = video ? 'Видеозвонок...' : 'Аудиозвонок...';
  try{
    const c = video
      ? { audio: true, video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } }
      : { audio: true, video: false };
    const s = await navigator.mediaDevices.getUserMedia(c);
    call.local = s;
    $('localVideo').srcObject = s;
    $('localVideo').muted = true;
    $('localVideo').play().catch(()=>{});
    if(typeof room.addStream === 'function') room.addStream(s);
    sendCall({ type: 'offer', isVideo: video }, pid);
  }catch(e){
    showToast('Нет доступа к камере/микрофону');
    resetCall();
  }
}

function acceptCall(){
  const pid = call.peer;
  $('incoming').classList.remove('open');
  stopRing();
  call.incoming = false;
  call.active = true;
  call.mic = true;
  call.cam = call.video;
  (async () => {
    try{
      const c = call.video
        ? { audio: true, video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' } }
        : { audio: true, video: false };
      const s = await navigator.mediaDevices.getUserMedia(c);
      call.local = s;
      $('localVideo').srcObject = s;
      $('localVideo').muted = true;
      $('localVideo').play().catch(()=>{});
      if(typeof room.addStream === 'function') room.addStream(s);
      sendCall({ type: 'accept' }, pid);
      openCallUI();
      startTimer();
    }catch(e){
      sendCall({ type: 'reject', reason: 'no-media' }, pid);
      resetCall();
    }
  })();
}

function handleCall(sig, pid){
  if(sig.type === 'offer'){
    if(call.active){ sendCall({ type: 'reject', reason: 'busy' }, pid); return; }
    call.incoming = true;
    call.video = sig.isVideo;
    call.peer = pid;
    const n = peers.get(pid)?.name || 'Собеседник';
    $('incName').textContent = n;
    $('incAv').textContent = ini(n);
    $('incType').textContent = sig.isVideo ? '📹 Видеозвонок' : '📞 Аудиозвонок';
    $('incoming').classList.add('open');
    playRing();
  } else if(sig.type === 'accept'){
    $('outMini').classList.remove('open');
    openCallUI();
    startTimer();
  } else if(sig.type === 'reject'){
    $('outMini').classList.remove('open');
    showToast(sig.reason === 'busy' ? 'Занят' : 'Отклонён');
    resetCall();
  } else if(sig.type === 'end'){
    showToast('Звонок завершён');
    endCall(false);
  }
}

function openCallUI(){
  const n = peers.get(call.peer)?.name || 'Собеседник';
  $('callScreen').classList.add('open');
  $('callName').textContent = n;
  $('callMain').classList.toggle('audio', !call.video);
  $('cCam').style.display = call.video ? 'flex' : 'none';
  $('cMic').classList.remove('off');
  $('cCam').classList.remove('off');
  $('cMic').textContent = '🎤';
  $('cCam').textContent = '📹';
  if(call.remote){
    const rv = $('remoteVideo');
    rv.srcObject = call.remote;
    rv.play().catch(()=>{});
  }
}

function endCall(){
  if(room && call.peer) try{ sendCall({ type: 'end' }, call.peer); }catch(e){}
  const name = peers.get(call.peer)?.name || 'Собеседник';
  resetCall();
  addMsg('Звонок с ' + name + ' завершён', 'sys');
}

function resetCall(){
  stopRing();
  if(call.local) call.local.getTracks().forEach(t => t.stop());
  try{ if(room && typeof room.removeStream === 'function' && call.local) room.removeStream(call.local); }catch(e){}
  clearInterval(call.timer);
  call.active = false; call.incoming = false; call.video = false;
  call.local = null; call.remote = null; call.peer = null; call.timer = null;
  $('callScreen').classList.remove('open');
  $('incoming').classList.remove('open');
  $('outMini').classList.remove('open');
  $('remoteVideo').srcObject = null;
  $('localVideo').srcObject = null;
  $('callTime').textContent = '00:00';
}

function startTimer(){
  call.start = Date.now();
  clearInterval(call.timer);
  call.timer = setInterval(() => {
    const s = Math.floor((Date.now() - call.start) / 1000);
    $('callTime').textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }, 1000);
}

let ringInt = null;
function playRing(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const b = () => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 800; o.type = 'sine';
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(); o.stop(ctx.currentTime + 0.4);
    };
    b(); ringInt = setInterval(b, 1200);
  }catch(e){}
}
function stopRing(){ if(ringInt){ clearInterval(ringInt); ringInt = null; } }

/* ============= UI EVENTS (сразу) ============= */
$('themeBtn').onclick = () => {
  S.theme = S.theme === 'light' ? 'dark' : 'light';
  applyTheme(); saveSettings();
};

$('menuBtn').onclick = () => {
  $('menu').classList.add('open');
  $('backdrop').classList.add('open');
};
$('menuClose').onclick = () => {
  $('menu').classList.remove('open');
  $('backdrop').classList.remove('open');
};
$('backdrop').onclick = () => {
  $('menu').classList.remove('open');
  $('backdrop').classList.remove('open');
};

$('mJoin').onclick = () => {
  $('menu').classList.remove('open');
  $('backdrop').classList.remove('open');
  const n = prompt('Название комнаты (одинаковое у обоих):', localStorage.getItem('aurora_room') || '');
  if(!n) return;
  const c = n.trim().toLowerCase().replace(/[^a-z0-9\-_]/g, '');
  if(!c){ showToast('Только a-z, 0-9, -, _'); return; }
  localStorage.setItem('aurora_room', c);
  location.href = location.origin + location.pathname + '#room=' + c;
};

$('mLeave').onclick = () => {
  $('menu').classList.remove('open');
  $('backdrop').classList.remove('open');
  if(!confirm('Покинуть комнату?')) return;
  localStorage.removeItem('aurora_room');
  location.href = location.origin + location.pathname;
};

$('mNotes').onclick = () => {
  $('menu').classList.remove('open');
  $('backdrop').classList.remove('open');
  if(room){
    if(!confirm('Выйти из комнаты и открыть заметки?')) return;
    localStorage.removeItem('aurora_room');
    location.href = location.origin + location.pathname;
  } else {
    enterNotesMode();
  }
};

$('mClear').onclick = () => {
  $('menu').classList.remove('open');
  $('backdrop').classList.remove('open');
  if(!confirm(notesMode ? 'Очистить заметки?' : 'Очистить чат?')) return;
  clearMsgs();
  if(notesMode){ setNotes([]); showToast('🗑 Очищено'); }
  else showToast('🗑 Чат очищен');
};

$('mNotify').onclick = () => {
  $('menu').classList.remove('open');
  $('backdrop').classList.remove('open');
  S.notify = !S.notify;
  saveSettings();
  showToast(S.notify ? '🔔 Уведомления вкл' : '🔕 Выкл');
  if(S.notify) askNotify();
};

$('mSettings').onclick = () => {
  $('menu').classList.remove('open');
  $('backdrop').classList.remove('open');
  $('nickInput').value = S.nick;
  $('passInput').value = S.pass;
  $('settingsBg').classList.add('open');
};
$('setCancel').onclick = () => $('settingsBg').classList.remove('open');
$('setSave').onclick = async () => {
  S.nick = $('nickInput').value.trim() || 'Аноним';
  S.pass = $('passInput').value;
  saveSettings();
  if(roomId && !notesMode) await initCrypto(roomId);
  if(room && sendName) try{ sendName(S.nick); }catch(e){}
  showToast('✅ Сохранено');
  $('settingsBg').classList.remove('open');
};

$('joinBtn').onclick = () => {
  const raw = $('roomInput').value.trim().toLowerCase();
  const c = raw.replace(/[^a-z0-9\-_]/g, '');
  if(!c){ showToast('Введите название'); return; }
  localStorage.setItem('aurora_room', c);
  location.href = location.origin + location.pathname + '#room=' + c;
};
$('roomInput').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); $('joinBtn').click(); }
});

$('sendBtn').onclick = sendMsg;
$('msgInput').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); }
});
$('msgInput').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 130) + 'px';
  if(notesMode || !room || !sendTyp) return;
  const n = Date.now();
  if(n - lastTyp > 900){ try{ sendTyp(true); }catch(e){} lastTyp = n; }
});

$('fileBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = async e => {
  const files = [...e.target.files];
  e.target.value = '';
  for(const f of files) await sendFile(f);
};

$('callAudio').onclick = () => startCall(false);
$('callVideo').onclick = () => startCall(true);

$('cMic').onclick = () => {
  if(!call.local) return;
  call.mic = !call.mic;
  call.local.getAudioTracks().forEach(t => t.enabled = call.mic);
  $('cMic').classList.toggle('off', !call.mic);
  $('cMic').textContent = call.mic ? '🎤' : '🔇';
};
$('cCam').onclick = () => {
  if(!call.local) return;
  call.cam = !call.cam;
  call.local.getVideoTracks().forEach(t => t.enabled = call.cam);
  $('cCam').classList.toggle('off', !call.cam);
  $('cCam').textContent = call.cam ? '📹' : '🚫';
};
$('cEnd').onclick = () => endCall();

$('incAcc').onclick = acceptCall;
$('incRej').onclick = () => {
  const pid = call.peer;
  $('incoming').classList.remove('open');
  stopRing();
  if(room && pid) try{ sendCall({ type: 'reject' }, pid); }catch(e){}
  resetCall();
};

$('outCancel').onclick = () => {
  if(room && call.peer) try{ sendCall({ type: 'end' }, call.peer); }catch(e){}
  resetCall();
};

/* Первый тап — спрашиваем уведомления */
document.addEventListener('click', function once(){
  askNotify();
  document.removeEventListener('click', once);
}, { once: true });

/* ============= INIT ============= */
(function init(){
  loadSettings();
  applyTheme();

  const roomFromUrl = new URLSearchParams(location.hash.slice(1)).get('room');
  const savedRoom = roomFromUrl || localStorage.getItem('aurora_room');

  if(savedRoom){
    enterNotesMode(); // сначала показать заметки, чтобы UI был живой
    startRoom(savedRoom); // потом подключиться
  } else {
    enterNotesMode();
  }
})();
</script>
