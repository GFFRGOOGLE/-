<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurora</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0b1120;color:#e8eaf0;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:15px}
body.light{background:#f8fafc;color:#0f172a}
.hdr{padding:12px 14px;background:#121826;border-bottom:1px solid #232a42;display:flex;align-items:center;gap:8px;flex-shrink:0}
body.light .hdr{background:#fff;border-color:#e2e8f0}
.hdr h1{flex:1;font-size:16px;font-weight:700;background:linear-gradient(135deg,#22d3ee,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr button{width:40px;height:40px;border-radius:12px;border:1px solid #232a42;background:#0b1120;color:#94a3b8;font-size:18px;cursor:pointer;flex-shrink:0}
body.light .hdr button{background:#f8fafc;border-color:#e2e8f0;color:#64748b}
.hdr button:active{background:#1a2035}
.hdr button.exit{color:#f43f5e;border-color:#f43f5e}
.rb{padding:10px 14px;background:#121826;border-bottom:1px solid #232a42;display:flex;gap:8px;flex-shrink:0}
body.light .rb{background:#fff;border-color:#e2e8f0}
.rb input{flex:1;padding:12px 14px;background:#0b1120;border:1px solid #232a42;border-radius:12px;color:#e8eaf0;font-size:14px;outline:none;min-width:0}
body.light .rb input{background:#f8fafc;border-color:#e2e8f0;color:#0f172a}
.rb input:focus{border-color:#22d3ee}
.rb button{padding:12px 18px;background:linear-gradient(135deg,#22d3ee,#a78bfa);border:none;border-radius:12px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0}
.rb button:active{opacity:.8}
#st{padding:6px 14px;background:#0b1120;border-bottom:1px solid #232a42;font-size:11px;color:#64748b;text-align:center;flex-shrink:0}
body.light #st{background:#f8fafc;border-color:#e2e8f0}
#st.ok{color:#10b981}#st.err{color:#f43f5e}#st.busy{color:#fbbf24}
#msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.4;word-wrap:break-word;transition:.15s}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#0891b2,#7c3aed);color:#fff;border-bottom-right-radius:6px;cursor:pointer}
.msg.me:active{transform:scale(.98);opacity:.85}
.msg.them{align-self:flex-start;background:#1e293b;border:1px solid #232a42;border-bottom-left-radius:6px}
body.light .msg.them{background:#e2e8f0;border-color:#cbd5e1;color:#0f172a}
.msg.sys{align-self:center;background:transparent;color:#64748b;font-size:12px;padding:5px 14px;text-align:center;border:1px dashed #334155;border-radius:100px;max-width:90%}
.msg .nm{font-size:11.5px;font-weight:700;color:#22d3ee;margin-bottom:3px}
.msg img,.msg video{max-width:100%;border-radius:12px;margin-top:6px;display:block;max-height:380px;object-fit:cover}
.msg audio{width:100%;margin-top:6px;height:40px}
.fc{display:flex;align-items:center;gap:10px;min-width:200px;padding:4px}
.ft{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.msg.them .ft{background:rgba(0,0,0,.15)}
.fi{flex:1;min-width:0}
.fn{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs{font-size:11px;opacity:.7;margin-top:2px}
.fd{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;color:inherit;text-decoration:none;font-size:15px;flex-shrink:0}
.msg.them .fd{background:rgba(0,0,0,.15)}
.pr{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-top:8px}
.pr i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa);width:0;transition:width .2s}
.ib{padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px) + 60px);display:flex;gap:6px;background:#121826;border-top:1px solid #232a42;flex-shrink:0;align-items:flex-end}
body.light .ib{background:#fff;border-color:#e2e8f0}
.ib button{width:44px;height:44px;border-radius:12px;border:1px solid #232a42;background:#0b1120;color:#94a3b8;font-size:18px;cursor:pointer;flex-shrink:0}
body.light .ib button{background:#f8fafc;border-color:#e2e8f0;color:#64748b}
.ib button:active{background:#1a2035}
.ib button.rec{background:#f43f5e;color:#fff;border-color:#f43f5e}
.ib textarea{flex:1;min-height:44px;max-height:120px;padding:12px 14px;background:#0b1120;border:1px solid #232a42;border-radius:14px;color:#e8eaf0;font-size:14.5px;font-family:inherit;outline:none;resize:none;line-height:1.4;min-width:120px}
body.light .ib textarea{background:#f8fafc;border-color:#e2e8f0;color:#0f172a}
.ib textarea:focus{border-color:#22d3ee}
.ib .sd{width:44px;height:44px;border-radius:12px;border:none;background:linear-gradient(135deg,#22d3ee,#a78bfa);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
#tt{position:fixed;bottom:120px;left:50%;transform:translateX(-50%) translateY(100px);padding:12px 22px;background:#1a2035;border:1px solid #334155;border-radius:14px;font-size:13.5px;color:#e8eaf0;opacity:0;transition:.3s;z-index:2000;max-width:90vw;text-align:center;pointer-events:none}
#tt.show{transform:translateX(-50%) translateY(0);opacity:1}
/* Модальное подтверждение удаления */
#delModal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;z-index:2100}
#delModal.open{display:flex}
.dm{background:#121826;border:1px solid #334155;border-radius:20px;padding:24px;max-width:340px;width:100%;text-align:center}
.dm h3{font-size:17px;margin-bottom:8px}
.dm p{font-size:13.5px;color:#94a3b8;margin-bottom:20px;line-height:1.5}
.dm .row{display:flex;gap:10px}
.dm button{flex:1;padding:12px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.dm .danger{background:#f43f5e;color:#fff}
.dm .cancel{background:#1e293b;color:#e8eaf0;border:1px solid #334155}
</style>
</head>
<body>

<div class="hdr">
  <h1 id="title">📝 Заметки</h1>
  <button id="btnNotes" onclick="A.notes()" title="Заметки">📝</button>
  <button id="btnExit" onclick="A.exit()" title="Выйти" class="exit" style="display:none">🚪</button>
  <button id="btnTheme" onclick="A.theme()" title="Тема">🌙</button>
</div>

<div class="rb" id="roomBar">
  <input id="roomInput" placeholder="Название комнаты" maxlength="40" autocomplete="off">
  <button id="joinBtn" onclick="A.join()">Войти</button>
</div>

<div id="st">Загрузка...</div>
<div id="msgs"></div>

<div class="ib">
  <button id="fileBtn" onclick="A.pickFile()">📎</button>
  <button id="photoBtn" onclick="A.pickPhoto()">🖼️</button>
  <textarea id="msgInput" placeholder="Сообщение..." rows="1"></textarea>
  <button id="voiceBtn" onclick="A.voice()">🎤</button>
  <button class="sd" id="sendBtn" onclick="A.send()">➤</button>
</div>

<input type="file" id="fileInput" multiple style="display:none">
<input type="file" id="photoInput" accept="image/*,video/*" multiple style="display:none">
<div id="tt"></div>

<div id="delModal">
  <div class="dm">
    <h3>Удалить сообщение?</h3>
    <p>Оно исчезнет у вас. Если вы в комнате — у вас локально.</p>
    <div class="row">
      <button class="cancel" onclick="A.closeDel()">Отмена</button>
      <button class="danger" onclick="A.confirmDel()">Удалить</button>
    </div>
  </div>
</div>

<script>
var A = {};

// ============ СОСТОЯНИЕ ============
A.$ = function(id){ return document.getElementById(id); };
A.msgs = null; A.st = null; A.tt = null;
A.room = null;
A.sendText = null; A.sendFileMeta = null; A.sendFileChunk = null; A.sendFileEnd = null;
A.sendTyp = null; A.sendName = null;
A.cryptoKey = null;
A.notesMode = true;
A.roomId = null;
A.peers = {};
A.recv = {};
A.lastTyp = 0;
A.mediaRec = null;
A.audioChunks = [];
A.NOTE_KEY = 'aurora_notes_v5';
A.ROOM_KEY = 'aurora_room_v5';
A.THEME_KEY = 'aurora_theme_v5';
A.CHUNK = 16 * 1024;
A.curDelEl = null;

// ============ УТИЛИТЫ ============
A.toast = function(t, d){
  d = d || 2200;
  if(!A.tt) return;
  A.tt.textContent = t;
  A.tt.classList.add('show');
  clearTimeout(A.tt._t);
  A.tt._t = setTimeout(function(){ A.tt.classList.remove('show'); }, d);
};
A.setSt = function(t, cls){
  if(!A.st) return;
  A.st.textContent = t;
  A.st.className = cls || '';
};
A.gid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); };
A.esc = function(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
A.fmt = function(b){
  if(b < 1024) return b + ' B';
  if(b < 1048576) return (b/1024).toFixed(1) + ' KB';
  if(b < 1073741824) return (b/1048576).toFixed(1) + ' MB';
  return (b/1073741824).toFixed(2) + ' GB';
};
A.isImg = function(n){ return /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(n); };
A.isVid = function(n){ return /\.(mp4|webm|ogg|mov|mkv)$/i.test(n); };
A.isAud = function(n){ return /\.(mp3|wav|ogg|m4a|flac|aac|webm)$/i.test(n); };

// ============ СООБЩЕНИЯ ============
A.addMsg = function(text, type, sender, msgId){
  if(!A.msgs) return null;
  type = type || 'them';
  var d = document.createElement('div');
  d.className = 'msg ' + type;
  if(msgId) d.dataset.msgid = msgId;
  if(sender && type === 'them'){
    var n = document.createElement('div');
    n.className = 'nm';
    n.textContent = sender;
    d.appendChild(n);
  }
  var sp = document.createElement('span');
  sp.textContent = text;
  d.appendChild(sp);
  A.msgs.appendChild(d);
  A.msgs.scrollTop = A.msgs.scrollHeight;
  return d;
};
A.clearMsgs = function(){ if(A.msgs) A.msgs.innerHTML = ''; };

A.renderFile = function(name, size, url, side, msgId, sender){
  if(!A.msgs) return null;
  var d = document.createElement('div');
  d.className = 'msg ' + side;
  if(msgId) d.dataset.msgid = msgId;
  if(sender && side === 'them'){
    var n = document.createElement('div');
    n.className = 'nm';
    n.textContent = sender;
    d.appendChild(n);
  }
  var ic = A.isImg(name) ? '🖼️' : A.isVid(name) ? '🎬' : A.isAud(name) ? '🎵' : '📄';
  var prev = '';
  if(A.isImg(name)) prev = '<img src="' + url + '">';
  else if(A.isVid(name)) prev = '<video src="' + url + '" controls></video>';
  else if(A.isAud(name)) prev = '<audio src="' + url + '" controls></audio>';
  d.innerHTML =
    '<div class="fc">' +
      '<div class="ft">' + ic + '</div>' +
      '<div class="fi">' +
        '<div class="fn">' + A.esc(name) + '</div>' +
        '<div class="fs">' + A.fmt(size) + '</div>' +
      '</div>' +
      '<a class="fd" href="' + url + '" download="' + A.esc(name) + '">⬇</a>' +
    '</div>' + prev;
  A.msgs.appendChild(d);
  A.msgs.scrollTop = A.msgs.scrollHeight;
  return d;
};

// ============ ЗАМЕТКИ ============
A.getNotes = function(){
  try { return JSON.parse(localStorage.getItem(A.NOTE_KEY) || '[]'); }
  catch(e){ return []; }
};
A.setNotes = function(a){
  try { localStorage.setItem(A.NOTE_KEY, JSON.stringify(a.slice(-500))); }
  catch(e){}
};
A.addNote = function(item){
  var a = A.getNotes(); a.push(item); A.setNotes(a);
};
A.delNote = function(id){
  A.setNotes(A.getNotes().filter(function(x){ return x.id !== id; }));
};
A.blobToB64 = function(blob){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onload = function(){ res(r.result.split(',')[1]); };
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
};
A.b64ToBlob = function(b64, type){
  var bin = atob(b64);
  var arr = new Uint8Array(bin.length);
  for(var i=0; i<bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: type || 'application/octet-stream' });
};
A.loadNotes = function(){
  A.clearMsgs();
  var notes = A.getNotes();
  if(!notes.length){
    A.addMsg('📝 Это заметки. Всё сохраняется. Войти в комнату — введите название сверху.', 'sys');
    return;
  }
  notes.forEach(function(n){
    if(n.type === 'text'){
      A.addMsg(n.text, 'me', null, n.id);
    } else if(n.type === 'file' && n.blobData){
      try {
        var url = URL.createObjectURL(A.b64ToBlob(n.blobData, n.fileType));
        A.renderFile(n.fileName, n.fileSize, url, 'me', n.id, null);
      } catch(e){}
    }
  });
};

// ============ ВЫХОД ИЗ КОМНАТЫ ============
A.exit = function(){
  if(A.notesMode){
    A.toast('Вы уже в заметках');
    return;
  }
  if(!confirm('Выйти из комнаты? Вернётесь к заметкам.')) return;
  
  // Останавливаем соединение
  try {
    if(A.room && typeof A.room.leave === 'function'){
      A.room.leave();
    }
  } catch(e){}
  
  // Очищаем состояние
  A.room = null;
  A.peers = {};
  A.recv = {};
  A.sendText = null;
  A.sendFileMeta = null;
  A.sendFileChunk = null;
  A.sendFileEnd = null;
  A.sendTyp = null;
  A.sendName = null;
  A.notesMode = true;
  A.roomId = null;
  
  // Убираем из URL
  try { localStorage.removeItem(A.ROOM_KEY); } catch(e){}
  history.replaceState(null, '', location.origin + location.pathname);
  
  // Обновляем UI
  A.$('btnExit').style.display = 'none';
  A.$('roomBar').style.display = 'flex';
  A.$('title').textContent = '📝 Заметки';
  A.loadNotes();
  A.setSt('Заметки. Всё сохраняется.');
  A.toast('🚪 Вы вышли из комнаты');
};

// ============ UI ============
A.notes = function(){
  if(A.room){
    A.exit();
    return;
  }
  A.notesMode = true;
  A.roomId = null;
  A.$('title').textContent = '📝 Заметки';
  A.$('btnExit').style.display = 'none';
  A.$('roomBar').style.display = 'flex';
  A.loadNotes();
  A.setSt('Заметки. Всё сохраняется.');
};

A.theme = function(){
  var light = document.body.classList.toggle('light');
  try { localStorage.setItem(A.THEME_KEY, light ? 'light' : 'dark'); } catch(e){}
  var b = A.$('btnTheme');
  if(b) b.textContent = light ? '☀️' : '🌙';
};

A.pickFile = function(){ if(A.$('fileInput')) A.$('fileInput').click(); };
A.pickPhoto = function(){ if(A.$('photoInput')) A.$('photoInput').click(); };

A.send = function(){
  var inp = A.$('msgInput');
  if(!inp) return;
  var t = inp.value.trim();
  if(!t) return;
  var id = A.gid();
  if(A.notesMode){
    A.addMsg(t, 'me', null, id);
    A.addNote({ id: id, type: 'text', text: t, ts: Date.now() });
    inp.value = '';
    inp.style.height = 'auto';
    return;
  }
  if(!A.room || !A.sendText){
    A.toast('Сначала войдите в комнату');
    return;
  }
  A.encText(t).then(function(payload){
    payload.msgId = id;
    try {
      A.sendText(payload);
      A.addMsg(t, 'me', null, id);
      inp.value = '';
      inp.style.height = 'auto';
    } catch(e){
      A.toast('Ошибка: ' + e.message);
    }
  });
};

// ============ УДАЛЕНИЕ СООБЩЕНИЙ ============
A.askDel = function(el){
  A.curDelEl = el;
  A.$('delModal').classList.add('open');
};
A.closeDel = function(){
  A.$('delModal').classList.remove('open');
  A.curDelEl = null;
};
A.confirmDel = function(){
  var el = A.curDelEl;
  A.$('delModal').classList.remove('open');
  A.curDelEl = null;
  if(!el) return;
  var id = el.dataset.msgid;
  el.remove();
  if(A.notesMode){
    if(id) A.delNote(id);
  }
  A.toast('🗑 Удалено');
};

// ============ КРИПТО ============
A.initCrypto = function(id){
  return new Promise(function(res){
    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode('p2p:' + id), { name: 'PBKDF2' }, false, ['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: enc.encode('aurora'), iterations: 100000, hash: 'SHA-256' },
          km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
        );
      })
      .then(function(k){ A.cryptoKey = k; res(); })
      .catch(function(){ A.cryptoKey = null; res(); });
  });
};
A.encText = function(text){
  if(!A.cryptoKey) return Promise.resolve({ plain: text });
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, A.cryptoKey, new TextEncoder().encode(text))
    .then(function(c){ return { iv: Array.from(iv), enc: Array.from(new Uint8Array(c)) }; });
};
A.decText = function(p){
  if(p.plain !== undefined) return Promise.resolve(p.plain);
  if(!A.cryptoKey) return Promise.resolve('[шифровано]');
  return crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: new Uint8Array(p.iv) },
    A.cryptoKey, new Uint8Array(p.enc)
  ).then(function(r){ return new TextDecoder().decode(r); })
   .catch(function(){ return '[ошибка]'; });
};
A.encBuf = function(buf){
  if(!A.cryptoKey) return Promise.resolve(buf);
  var iv = crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, A.cryptoKey, buf)
    .then(function(c){
      var o = new Uint8Array(12 + c.byteLength);
      o.set(iv, 0); o.set(new Uint8Array(c), 12);
      return o.buffer;
    });
};
A.decBuf = function(buf){
  if(!A.cryptoKey) return Promise.resolve(buf);
  var v = new Uint8Array(buf);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: v.slice(0,12) }, A.cryptoKey, v.slice(12));
};

// ============ ОТПРАВКА ФАЙЛА ============
A.sendFile = function(file){
  var id = A.gid();
  if(A.notesMode){
    var url = URL.createObjectURL(file);
    A.renderFile(file.name, file.size, url, 'me', id, null);
    if(file.size < 4 * 1024 * 1024){
      return A.blobToB64(file).then(function(bd){
        A.addNote({
          id: id, type: 'file',
          fileName: file.name, fileSize: file.size, fileType: file.type,
          blobData: bd, ts: Date.now()
        });
        A.toast('📝 Сохранено');
      }).catch(function(){ A.toast('Не удалось сохранить файл'); });
    } else {
      A.toast('⚠️ Файл > 4 МБ — не сохранится навсегда');
      return Promise.resolve();
    }
  }
  if(!A.room || !A.sendFileMeta){
    A.toast('Сначала войдите в комнату');
    return Promise.resolve();
  }
  var enc = !!A.cryptoKey;
  try {
    A.sendFileMeta({ id: id, name: file.name, size: file.size, type: file.type, encrypted: enc });
  } catch(e){ A.toast('Ошибка отправки'); return Promise.resolve(); }

  return file.arrayBuffer().then(function(buf){
    var total = buf.byteLength;
    var sent = 0;
    var tempEl = document.createElement('div');
    tempEl.className = 'msg me';
    tempEl.dataset.msgid = id;
    tempEl.innerHTML =
      '<div class="fc">' +
        '<div class="ft">📄</div>' +
        '<div class="fi">' +
          '<div class="fn">' + A.esc(file.name) + '</div>' +
          '<div class="fs">' + A.fmt(file.size) + ' · 0%</div>' +
        '</div>' +
      '</div>' +
      '<div class="pr"><i></i></div>';
    A.msgs.appendChild(tempEl);
    A.msgs.scrollTop = A.msgs.scrollHeight;
    var bar = tempEl.querySelector('.pr i');
    var info = tempEl.querySelector('.fs');

    function next(){
      if(sent >= total){
        try { A.sendFileEnd({ id: id }, null); } catch(e){}
        var finalUrl = URL.createObjectURL(file);
        tempEl.remove();
        A.renderFile(file.name, file.size, finalUrl, 'me', id, null);
        A.toast('📤 Отправлено');
        return;
      }
      var slice = buf.slice(sent, sent + A.CHUNK);
      var promise = enc ? A.encBuf(slice).catch(function(){ return slice; }) : Promise.resolve(slice);
      promise.then(function(ch){
        try { A.sendFileChunk(ch, null, { id: id }); } catch(e){}
        sent += slice.byteLength;
        var p = Math.round(sent / total * 100);
        bar.style.width = p + '%';
        info.textContent = A.fmt(file.size) + ' · ' + p + '%';
        setTimeout(next, 0);
      });
    }
    next();
  });
};

// ============ ГОЛОСОВОЕ ============
A.voice = function(){
  var btn = A.$('voiceBtn');
  if(A.mediaRec && A.mediaRec.state === 'recording'){
    A.mediaRec.stop();
    if(btn){ btn.classList.remove('rec'); btn.textContent = '🎤'; }
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(function(stream){
      A.mediaRec = new MediaRecorder(stream);
      A.audioChunks = [];
      A.mediaRec.ondataavailable = function(e){ A.audioChunks.push(e.data); };
      A.mediaRec.onstop = function(){
        var blob = new Blob(A.audioChunks, { type: 'audio/webm' });
        var file = new File([blob], 'voice-' + Date.now() + '.webm', { type: 'audio/webm' });
        A.sendFile(file);
        stream.getTracks().forEach(function(t){ t.stop(); });
      };
      A.mediaRec.start();
      if(btn){ btn.classList.add('rec'); btn.textContent = '⏹'; }
      A.toast('🎤 Запись... Нажмите ещё раз');
    })
    .catch(function(){ A.toast('Нет доступа к микрофону'); });
};

// ============ ВХОД В КОМНАТУ ============
A.join = function(){
  var inp = A.$('roomInput');
  if(!inp) return;
  var raw = inp.value.trim().toLowerCase();
  var c = raw.replace(/[^a-z0-9\-_]/g, '');
  if(!c){ A.toast('Введите название комнаты'); return; }
  try { localStorage.setItem(A.ROOM_KEY, c); } catch(e){}
  A.startRoom(c);
};

A.startRoom = function(id){
  A.setSt('⏳ Загрузка библиотеки связи...', 'busy');
  A.notesMode = false;
  A.roomId = id;
  A.$('title').textContent = 'Комната: ' + id;
  A.$('btnExit').style.display = 'flex';
  A.$('roomBar').style.display = 'none';

  var urls = [
    'https://esm.sh/trystero@0.21.5/nostr',
    'https://cdn.jsdelivr.net/npm/trystero@0.21.5/nostr/+esm',
    'https://esm.sh/trystero@0.21.5/mqtt',
    'https://esm.sh/trystero@0.21.5/torrent'
  ];
  var idx = 0;
  function tryLoad(){
    if(idx >= urls.length){
      A.setSt('❌ Не удалось загрузить библиотеку', 'err');
      A.toast('Попробуйте позже', 4000);
      return;
    }
    var u = urls[idx]; idx++;
    A.setSt('⏳ Загрузка ' + idx + '/' + urls.length + '...', 'busy');
    import(u).then(function(mod){
      if(mod && mod.joinRoom){
        A.setSt('⏳ Ключ шифрования...', 'busy');
        A.initCrypto(id).then(function(){
          A.setSt('⏳ Подключение...', 'busy');
          A.connect(id, mod);
        });
      } else { tryLoad(); }
    }).catch(function(e){
      console.warn('Fail', u, e.message);
      tryLoad();
    });
  }
  tryLoad();
};

A.connect = function(id, mod){
  try {
    var iceServers = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
      { urls: 'stun:stun.nextcloud.com:443' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turns:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
    ];

    A.room = mod.joinRoom({
      appId: 'aurora-chat-v6',
      rtcConfig: {
        iceServers: iceServers,
        iceCandidatePoolSize: 10
      }
    }, id);
    location.hash = 'room=' + id;

    var a1 = A.room.makeAction('t');
    A.sendText = a1[0];
    var onText = a1[1];

    var a2 = A.room.makeAction('fm');
    A.sendFileMeta = a2[0];
    var onFileMeta = a2[1];

    var a3 = A.room.makeAction('fc');
    A.sendFileChunk = a3[0];
    var onFileChunk = a3[1];

    var a4 = A.room.makeAction('fe');
    A.sendFileEnd = a4[0];
    var onFileEnd = a4[1];

    var a5 = A.room.makeAction('typ');
    A.sendTyp = a5[0];
    var onTyp = a5[1];

    var a6 = A.room.makeAction('n');
    A.sendName = a6[0];
    var onName = a6[1];

    onText(function(payload, peerId){
      A.decText(payload).then(function(text){
        var name = (A.peers[peerId] && A.peers[peerId].name) || 'Аноним';
        A.addMsg(text, 'them', name, payload.msgId);
      });
    });

    onFileMeta(function(meta, peerId){
      A.recv[meta.id] = {
        name: meta.name, size: meta.size, type: meta.type,
        encrypted: !!meta.encrypted, chunks: [], sender: peerId
      };
    });
    onFileChunk(function(chunk, peerId, meta){
      var f = A.recv[meta && meta.id];
      if(f) f.chunks.push(chunk);
    });
    onFileEnd(function(meta, peerId){
      var f = A.recv[meta.id];
      if(!f) return;
      var done = function(chunks){
        var blob = new Blob(chunks, { type: f.type || 'application/octet-stream' });
        var url = URL.createObjectURL(blob);
        var name = (A.peers[peerId] && A.peers[peerId].name) || 'Аноним';
        A.renderFile(f.name, f.size, url, 'them', meta.id, name);
      };
      if(f.encrypted && A.cryptoKey){
        var out = [];
        var p = Promise.resolve();
        f.chunks.forEach(function(ch){
          p = p.then(function(){
            return A.decBuf(ch).then(function(d){ out.push(d); }).catch(function(){ out.push(ch); });
          });
        });
        p.then(function(){ done(out); delete A.recv[meta.id]; });
      } else {
        done(f.chunks);
        delete A.recv[meta.id];
      }
    });

    onTyp(function(isT, peerId){
      if(!isT) return;
      var name = (A.peers[peerId] && A.peers[peerId].name) || 'Кто-то';
      A.setSt(name + ' печатает...', 'busy');
      clearTimeout(window._tt);
      window._tt = setTimeout(A.updateSt, 2000);
    });

    onName(function(name, peerId){
      if(!A.peers[peerId]) A.peers[peerId] = { name: name };
      else A.peers[peerId].name = name;
      A.updateSt();
    });

    A.room.onPeerJoin(function(peerId){
      if(!A.peers[peerId]) A.peers[peerId] = { name: 'Аноним-' + String(peerId).slice(0,4) };
      A.addMsg('👤 Кто-то присоединился', 'sys');
      try { A.sendName('Аноним', peerId); } catch(e){}
      setTimeout(function(){ try { A.sendName('Аноним', peerId); } catch(e){} }, 700);
      setTimeout(function(){ try { A.sendName('Аноним', peerId); } catch(e){} }, 1800);
      A.updateSt();
    });

    A.room.onPeerLeave(function(peerId){
      var name = (A.peers[peerId] && A.peers[peerId].name) || 'Участник';
      delete A.peers[peerId];
      A.addMsg('👋 ' + name + ' вышел', 'sys');
      A.updateSt();
    });

    A.clearMsgs();
    A.addMsg('🔒 Подключено к комнате «' + id + '»', 'sys');
    A.addMsg('Ссылка для друга: ' + location.origin + location.pathname + '#room=' + id, 'sys');
    A.updateSt();
    A.toast('✅ Комната: ' + id);

  } catch(e){
    A.setSt('❌ ' + e.message, 'err');
    A.toast('Ошибка: ' + e.message, 4000);
    A.notesMode = true;
    A.$('title').textContent = '📝 Заметки';
    A.$('btnExit').style.display = 'none';
    A.$('roomBar').style.display = 'flex';
    A.loadNotes();
  }
};

A.updateSt = function(){
  if(A.notesMode){
    A.setSt('Заметки. Всё сохраняется.');
    return;
  }
  var count = Object.keys(A.peers).length;
  if(count === 0){
    A.setSt('✅ В комнате. Ожидание участников...', 'ok');
  } else {
    A.setSt('✅ В комнате: ' + count + ' участник(ов)', 'ok');
  }
};

// ============ INIT ============
A.boot = function(){
  A.msgs = A.$('msgs');
  A.st = A.$('st');
  A.tt = A.$('tt');

  try {
    if(localStorage.getItem(A.THEME_KEY) === 'light'){
      document.body.classList.add('light');
      if(A.$('btnTheme')) A.$('btnTheme').textContent = '☀️';
    }
  } catch(e){}

  var inp = A.$('msgInput');
  if(inp){
    inp.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); A.send(); }
    });
    inp.addEventListener('input', function(){
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      if(A.notesMode || !A.room || !A.sendTyp) return;
      var n = Date.now();
      if(n - A.lastTyp > 900){
        try { A.sendTyp(true); } catch(e){}
        A.lastTyp = n;
      }
    });
  }

  var ri = A.$('roomInput');
  if(ri){
    ri.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); A.join(); }
    });
  }

  var fi = A.$('fileInput');
  if(fi) fi.onchange = function(e){
    var files = Array.prototype.slice.call(e.target.files);
    e.target.value = '';
    var p = Promise.resolve();
    files.forEach(function(f){ p = p.then(function(){ return A.sendFile(f); }); });
  };
  var pi = A.$('photoInput');
  if(pi) pi.onchange = function(e){
    var files = Array.prototype.slice.call(e.target.files);
    e.target.value = '';
    var p = Promise.resolve();
    files.forEach(function(f){ p = p.then(function(){ return A.sendFile(f); }); });
  };

  // Долгий тап по СВОЕМУ сообщению → диалог удаления
  var lt = null;
  document.addEventListener('touchstart', function(e){
    var t = e.target;
    if(!t || !t.closest) return;
    var m = t.closest('.msg.me');
    if(!m || !m.dataset.msgid) return;
    lt = setTimeout(function(){
      A.askDel(m);
    }, 600);
  }, { passive: true });
  document.addEventListener('touchend', function(){ clearTimeout(lt); });
  document.addEventListener('touchmove', function(){ clearTimeout(lt); });

  // ПКМ для компьютера
  document.addEventListener('contextmenu', function(e){
    var t = e.target;
    if(!t || !t.closest) return;
    var m = t.closest('.msg.me');
    if(!m || !m.dataset.msgid) return;
    e.preventDefault();
    A.askDel(m);
  });

  // Старт
  try {
    var hash = location.hash.slice(1);
    var lastRoom = null;
    if(hash){
      var params = new URLSearchParams(hash);
      lastRoom = params.get('room');
    }
    if(!lastRoom) lastRoom = localStorage.getItem(A.ROOM_KEY);
    if(lastRoom){
      if(A.$('roomInput')) A.$('roomInput').value = lastRoom;
      A.startRoom(lastRoom);
    } else {
      A.loadNotes();
      A.setSt('Готово. Пишите — сохраняется.');
    }
  } catch(e){
    A.loadNotes();
    A.setSt('Готово.');
  }
};

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', A.boot);
} else {
  A.boot();
}

window.addEventListener('error', function(e){
  if(A.st) A.setSt('❌ ' + (e.message || 'unknown'), 'err');
});
</script>
