<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>✦ Приватный P2P-чат</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
/* ================= БАЗА / ПЕРЕМЕННЫЕ ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#05060f;
  --glass:rgba(15,17,30,.75);
  --glass2:rgba(15,17,30,.9);
  --border:rgba(255,255,255,.08);
  --text:#e8ecf5;
  --muted:#8b93a7;
  --cyan:#22d3ee;
  --purple:#a855f7;
  --pink:#ec4899;
  --them:rgba(255,255,255,.06);
  --grad:linear-gradient(135deg,#22d3ee,#a855f7);
}
body.light{
  --bg:#eef1f8;
  --glass:rgba(255,255,255,.8);
  --glass2:rgba(255,255,255,.95);
  --border:rgba(0,0,0,.08);
  --text:#0f1220;
  --muted:#5a6273;
  --them:rgba(0,0,0,.05);
}
html,body{height:100%;margin:0;padding:0}
body{
  display:flex;flex-direction:column;
  height:100dvh;height:100vh;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:15px;overflow:hidden;
  transition:background .3s,color .3s;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(128,128,150,.3);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ================= АНИМИРОВАННЫЙ ФОН ================= */
.blobs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.b1{width:340px;height:340px;background:#22d3ee;top:-80px;left:-60px;animation:f1 18s ease-in-out infinite}
.b2{width:400px;height:400px;background:#a855f7;bottom:-120px;right:-90px;animation:f2 22s ease-in-out infinite}
.b3{width:300px;height:300px;background:#ec4899;top:40%;left:55%;animation:f3 26s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,120px) scale(1.2)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-120px,-80px) scale(1.15)}}
@keyframes f3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-90px,90px) scale(.85)}}
body.light .blob{opacity:.28}

/* ================= СТЕКЛО ================= */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
}

/* ================= ШАПКА ================= */
.hdr{
  position:relative;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  border-left:none;border-right:none;border-top:none;
  flex:0 0 auto;
}
.logo{
  width:38px;height:38px;flex:0 0 auto;border-radius:12px;
  background:var(--grad);display:flex;align-items:center;justify-content:center;
  font-size:19px;color:#04121a;font-weight:900;
  box-shadow:0 0 24px rgba(34,211,238,.45);
  position:relative;overflow:hidden;
}
.logo::after{
  content:'';position:absolute;top:-60%;left:-120%;width:60%;height:220%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
  transform:rotate(20deg);animation:shine 3.2s ease-in-out infinite;
}
@keyframes shine{0%{left:-120%}55%{left:160%}100%{left:160%}}
.titles{flex:1;min-width:0}
.title{
  font-size:16px;font-weight:800;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.hdr-btns{display:flex;gap:6px;flex:0 0 auto}
.ibtn{
  position:relative;width:36px;height:36px;border-radius:11px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--text);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justi


fy-content:center;transition:transform .12s,background .2s;
  padding:0;line-height:1;
}
body.light .ibtn{background:rgba(0,0,0,.04)}
.ibtn:active{transform:scale(.94)}
.ibtn.danger{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.4)}
.ibtn.rec{background:rgba(239,68,68,.35);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.badge{
  position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;
  background:#ef4444;color:#fff;font-size:10px;font-weight:700;
  display:none;align-items:center;justify-content:center;padding:0 4px;line-height:17px;
}

/* ================= ПАНЕЛЬ УЧАСТНИКОВ ================= */
.members{
  display:none;gap:6px;padding:6px 12px;overflow-x:auto;white-space:nowrap;
  flex:0 0 auto;z-index:15;position:relative;
  -ms-overflow-style:none;scrollbar-width:none;
}
.members::-webkit-scrollbar{display:none}
.chip{
  display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;
  background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--muted);
  flex:0 0 auto;
}
.chip.host{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(168,85,247,.2));color:var(--text)}

/* ================= ПАНЕЛЬ КОМНАТЫ ================= */
.panel{margin:0 12px 8px;border-radius:16px;flex:0 0 auto;z-index:15;position:relative;overflow:hidden}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);user-select:none;
}
.panel.open .panel-head{color:var(--text)}
.panel-body{display:none;padding:0 12px 12px}
.panel.open .panel-body{display:block}
.modes{display:flex;gap:6px;margin-bottom:10px}
.mode{
  flex:1;padding:8px;border-radius:11px;border:1px solid var(--border);background:transparent;
  color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:.2s;font-family:inherit;
}
.mode.active{background:var(--grad);color:#04121a;border-color:transparent}
.row{display:flex;gap:6px;margin-bottom:8px}
input[type=text],textarea,input:not([type]){
  font-family:inherit;font-size:14px;
}
.row input{
  flex:1;min-width:0;padding:10px 12px;border-radius:11px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--text);outline:none;
}
body.light .row input{background:rgba(0,0,0,.04)}
.row input:focus{border-color:var(--cyan)}
.btn{
  padding:10px 14px;border-radius:11px;border:1px solid var(--border);
  background:rgba(255,255,255,.06);color:var(--text);font-size:13px;font-weight:600;
  cursor:pointer;transition:transform .12s,filter .2s;font-family:inherit;white-space:nowrap;
}
body.light .btn{background:rgba(0,0,0,.04)}
.btn:active{transform:scale(.94)}
.btn.grad{background:var(--grad);color:#04121a;border-color:transparent}
.btn.full{width:100%;display:block;margin-bottom:8px}
.hint{font-size:11px;color:var(--muted);margin:8px 0 5px;line-height:1.4}
.code{
  width:100%;height:70px;resize:vertical;padding:9px;border-radius:11px;font-size:10px;
  border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--text);
  font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;outline:none;
}
body.light .code{background:rgba(0,0,0,.05)}
.local-only{display:none}

/* ================= СООБЩЕНИЯ ================= */
.messages{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding:12px 12px 18px;display:flex;flex-direction:column;gap:8px;
  z-index:10;position:relative;scroll-behavior:smooth;
}
.datesep{
  align-self:center;font-size:11px;color:var(--muted);background:rgba(128,128,150,.12);
  padding:3px 12px;border-radius:12px;margin:6px 0;
}
.msg{display:flex;flex-direction:column;max-width:82%;animation:slideIn .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.them{align-self:flex-start;a


lign-items:flex-start}
.msg.sys{
  align-self:center;max-width:90%;font-size:11px;color:var(--muted);
  border:1px dashed var(--border);border-radius:12px;padding:5px 12px;text-align:center;
}
.meta{display:flex;gap:6px;align-items:center;font-size:10px;color:var(--muted);margin:0 6px 3px}
.sender{font-weight:700}
.bubble{
  padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.42;
  word-break:break-word;white-space:pre-wrap;overflow-wrap:anywhere;
  border:1px solid var(--border);
}
.msg.me .bubble{
  background:linear-gradient(135deg,#22d3ee,#a855f7);color:#04121a;
  border:none;border-bottom-right-radius:6px;
}
.msg.them .bubble{background:var(--them);border-bottom-left-radius:6px}
.bubble.file{padding:8px;max-width:300px}
.bubble img.prev,.bubble video.prev{max-width:100%;max-height:320px;border-radius:12px;display:block;cursor:pointer}
.bubble audio.prev-audio{width:100%;min-width:210px;display:block;margin-top:4px}
.filerow{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 4px}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsize{font-size:11px;opacity:.7;flex:0 0 auto}
.fi{font-size:20px}
.dl{
  display:inline-block;margin-top:6px;font-size:12px;font-weight:600;
  color:var(--cyan);text-decoration:none;padding:3px 8px;border-radius:8px;
  background:rgba(34,211,238,.12);
}
.msg.me .dl{color:#04121a;background:rgba(0,0,0,.18)}
.prog{height:4px;border-radius:4px;background:rgba(128,128,150,.25);margin-top:6px;overflow:hidden}
.prog .bar{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#a855f7);transition:width .15s}

/* ================= ПАНЕЛЬ ВВОДА ================= */
.inputbar{
  flex:0 0 auto;display:flex;align-items:flex-end;gap:7px;
  padding:9px 12px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px) + 60px);
  border-left:none;border-right:none;border-bottom:none;
  z-index:20;position:relative;
}
.inputbar textarea{
  flex:1;min-width:0;resize:none;max-height:130px;min-height:40px;
  padding:10px 13px;border-radius:16px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--text);outline:none;
  font-size:14.5px;line-height:1.35;font-family:inherit;
}
body.light .inputbar textarea{background:rgba(0,0,0,.04)}
.inputbar textarea:focus{border-color:var(--cyan)}
.ibtn.send{background:var(--grad);color:#04121a;border:none;width:40px;height:40px;border-radius:14px;font-size:17px}

/* ================= МОДАЛКИ ================= */
.modal{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);
  display:none;align-items:center;justify-content:center;padding:16px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.modal.show{display:flex}
.modal-box{
  background:var(--glass2);border:1px solid var(--border);border-radius:22px;
  padding:22px;max-width:380px;width:100%;text-align:center;
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  animation:slideIn .25s cubic-bezier(.2,.9,.3,1.2);
}
.nfc-icon{font-size:54px;margin-bottom:10px;animation:pulse2 1.6s infinite}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.modal-box h3{margin:6px 0 10px;font-size:17px}
.modal-box p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 16px}

/* Список чатов */
#chatsModal{align-items:stretch;padding:0}
.chats-box{
  background:var(--glass2);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  width:100%;height:100%;display:flex;flex-direction:column;
}
.chats-head{
  display:flex;align-items:center;gap:10px;padding:14px 16px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--border);
}
.chats-head h2{flex:1;margin:0;font-size:18px}
.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-item{
  display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:14px;
  cursor:pointer;transition:background .18s;margin-bottom:3px;user-select:none;
}
.chat-item:hover,.chat-item.active{background:r


gba(128,128,150,.14)}
.ci-ava{
  width:42px;height:42px;flex:0 0 auto;border-radius:13px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:19px;
}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ci-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font-size:11px;color:var(--muted);flex:0 0 auto}
.ci-prev{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ci-badge{
  min-width:20px;height:20px;border-radius:10px;background:#ef4444;color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;flex:0 0 auto;
}
.chats-foot{
  display:flex;gap:8px;padding:12px 14px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--border);
}
.chats-foot .btn{flex:1}

/* Меню чата */
.menu-box{padding:16px;max-width:320px}
.menu-box .btn{display:block;width:100%;margin-bottom:8px;text-align:center}

/* ================= ТОСТЫ ================= */
#toasts{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:calc(100% - 32px);max-width:420px;
}
.toast{
  background:var(--glass2);border:1px solid var(--border);border-radius:14px;
  padding:10px 16px;font-size:13px;color:var(--text);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  animation:slideIn .25s;box-shadow:0 8px 30px rgba(0,0,0,.4);
  text-align:center;
}

/* ================= АДАПТАЦИЯ ================= */
max-width:900px{
  .inputbar{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px) + 60px)}
}
max-width:600px{
  .msg{max-width:90%}
  .title{font-size:15px}
  .panel{margin:0 8px 6px}
  .messages{padding:10px 8px 14px}
  .inputbar{padding-left:8px;padding-right:8px;gap:5px}
  .ibtn{width:34px;height:34px;font-size:15px}
  .bubble.file{max-width:240px}
}
</style>
</head>
<body>

<!-- ================= ФОН ================= -->
<div class="blobs">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<!-- ================= ШАПКА ================= -->
<header class="hdr glass">
  <div class="logo">✦</div>
  <div class="titles">
    <div class="title" id="roomTitle">Мои заметки</div>
    <div class="sub" id="statusLine">Всё сохраняется</div>
  </div>
  <div class="hdr-btns">
    <button class="ibtn" onclick="A.openChats()" title="Чаты">💬<span class="badge" id="badgeChats"></span></button>
    <button class="ibtn" onclick="A.toggleMembers()" id="btnMembers" title="Участники" style="display:none">👥<span class="badge" id="badgeMembers">1</span></button>
    <button class="ibtn" onclick="A.toggleTheme()" id="btnTheme" title="Тема">🌙</button>
    <button class="ibtn danger" onclick="A.leaveRoom()" id="btnLeave" title="Выйти" style="display:none">✕</button>
  </div>
</header>

<!-- ================= УЧАСТНИКИ ================= -->
<div class="members" id="membersBar"></div>

<!-- ================= ПАНЕЛЬ КОМНАТЫ ================= -->
<section class="panel glass" id="roomPanel">
  <div class="panel-head" onclick="A.togglePanel()">
    <span>🔐 Комната</span>
    <span id="panelChev">▾</span>
  </div>
  <div class="panel-body">
    <div class="modes">
      <button class="mode active" id="modeNet" onclick="A.setMode('net')">🌍 Интернет</button>
      <button class="mode" id="modeLocal" onclick="A.setMode('local')">📡 Локально</button>
    </div>

    <div class="row">
      <input id="roomInput" type="text" placeholder="название-комнаты" autocomplete="off" spellcheck="false">
      <button class="ibtn" onclick="A.randomName()" title="Случайное имя">🎲</button>
    </div>
    <div class="row" id="netButtons">
      <button class="btn grad" style="flex:1" onclick="A.createRoom()">✨ Создать</butt
